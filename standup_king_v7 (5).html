<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stand-Up King!</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;image-rendering:pixelated;}
html,body{background:#000;font-family:'Press Start 2P',monospace;overflow:hidden;height:100%;width:100%;}
#G{width:100%;height:100vh;display:flex;flex-direction:column;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes slideup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes flashg{0%,100%{background:rgba(255,220,0,.18)}50%{background:rgba(255,220,0,.38)}}
@keyframes flashr{0%,100%{background:rgba(220,0,0,.18)}50%{background:rgba(220,0,0,.38)}}
@keyframes redglow{0%,100%{text-shadow:0 0 8px #f00}50%{text-shadow:0 0 24px #f66,0 0 48px #f00}}
@keyframes timerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes dance{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-14deg) translateY(-5px)}75%{transform:rotate(14deg) translateY(-5px)}}
@keyframes fall{0%{transform:rotate(0)}60%{transform:rotate(82deg) translateY(14px)}100%{transform:rotate(92deg) translateY(18px)}}
@keyframes eventPulse{0%,100%{box-shadow:0 0 8px rgba(255,160,0,.4)}50%{box-shadow:0 0 22px rgba(255,200,0,.8),inset 0 0 10px rgba(255,180,0,.2)}}
@keyframes edgyGlow{0%,100%{box-shadow:0 0 8px rgba(255,80,0,.4)}50%{box-shadow:0 0 20px rgba(255,100,0,.7),inset 0 0 8px rgba(255,60,0,.2)}}
@keyframes jGlow{0%,100%{box-shadow:0 0 8px rgba(80,180,255,.4)}50%{box-shadow:0 0 20px rgba(80,200,255,.8),inset 0 0 8px rgba(80,160,255,.2)}}
@keyframes crickets{0%,100%{transform:translateX(0)}10%,30%,50%,70%,90%{transform:translateX(-3px)}20%,40%,60%,80%{transform:translateX(3px)}}

// ════════════ AUDIO ════════════
var _ac=null;
function ac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;}
function tn(f,d,tp,v,w){tp=tp||'square';v=v||.07;w=w||0;if(f<=0)return;try{var c=ac(),t=c.currentTime+w,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=tp;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.06);}catch(e){}}
function nz(d,v,w,type){v=v||.2;w=w||0;try{var c=ac(),t=c.currentTime+w,sr=c.sampleRate,b=c.createBuffer(1,Math.ceil(sr*d),sr),dt=b.getChannelData(0);for(var i=0;i<dt.length;i++)dt[i]=(Math.random()*2-1)*(type==='fade'?1-i/dt.length:1);var s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(c.destination);s.start(t);s.stop(t+d);}catch(e){}}

// ══ JAZZ SEQUENCER — Seinfeld / Roger Rabbit style ══
// Tempo system: base beat, hot streak speeds it up
var _bt=null,_bp=0,_bi=0,_bm='off',_tempo=1.0;

// JAZZ THEME — D minor/Dorian, chromatic walks, blue notes
// Each entry: [freq_hz, duration_beats, type, vol]  type: 'm'=melody 'b'=bass 's'=stab
// Beat unit = 0.13s (swinging quarter note at ~115bpm)
var BEAT=0.13; // base beat duration — modified by tempo

// Melody line — Seinfeld-ish: short staccato phrases, chromatic slides, question marks
var JZ_MEL=[
  // phrase 1: rising chromatic question
  [294,1.5,'m',.045],[311,0.5,'m',.04],[330,1,'m',.05],[0,0.5,'m',0],
  [349,1,'m',.052],[370,0.5,'m',.04],[392,1.5,'m',.055],[0,0.5,'m',0],
  // phrase 2: answer — descends with swing
  [370,0.5,'m',.042],[349,0.5,'m',.04],[330,1,'m',.048],[311,0.5,'m',.038],
  [294,2,'m',.05],[0,1,'m',0],
  // phrase 3: offbeat stabs (Roger Rabbit style)
  [0,0.5,'m',0],[440,0.5,'m',.055],[0,0.5,'m',0],[415,0.5,'m',.05],
  [0,0.5,'m',0],[392,0.5,'m',.05],[370,1,'m',.048],[0,0.5,'m',0],
  // phrase 4: chromatic descent with blue note (Bb)
  [466,1,'m',.05],[440,0.5,'m',.045],[415,0.5,'m',.042],[392,1,'m',.05],
  [370,0.5,'m',.042],[349,0.5,'m',.04],[330,2,'m',.052],[0,1,'m',0],
  // phrase 5: punchline riff (the "dundun dundundun" feel)
  [294,0.5,'m',.06],[294,0.5,'m',.055],[0,0.5,'m',0],[294,0.5,'m',.06],
  [349,0.5,'m',.055],[370,0.5,'m',.05],[392,1,'m',.06],[0,0.5,'m',0],
  [415,0.5,'m',.058],[440,1,'m',.06],[0,0.5,'m',0],[415,0.5,'m',.05],
  [392,2,'m',.055],[0,2,'m',0],
];

// Bass line — walking chromatic, slap feel (very short durations)
var JZ_BAS=[
  // bars 1-2: D pedal with chromatic walk up
  [147,0.6,'b',.05],[0,0.4,'b',0],[165,0.6,'b',.048],[0,0.4,'b',0],
  [175,0.6,'b',.052],[0,0.4,'b',0],[185,0.6,'b',.05],[0,0.4,'b',0],
  [196,0.6,'b',.055],[0,0.4,'b',0],[208,0.5,'b',.048],[0,0.5,'b',0],
  [220,1,'b',.052],[0,1,'b',0],
  // bars 3-4: walk down chromatic (Wolff style)
  [220,0.6,'b',.05],[0,0.4,'b',0],[208,0.6,'b',.048],[0,0.4,'b',0],
  [196,0.6,'b',.05],[0,0.4,'b',0],[185,0.5,'b',.048],[0,0.5,'b',0],
  [175,0.6,'b',.05],[0,0.4,'b',0],[165,0.5,'b',.048],[0,0.5,'b',0],
  [155,0.6,'b',.05],[0,0.4,'b',0],[147,1,'b',.055],[0,1,'b',0],
  // bars 5-6: IV chord approach (G) + offbeats
  [0,0.5,'b',0],[196,0.5,'b',.055],[0,0.5,'b',0],[196,0.5,'b',.05],
  [208,0.6,'b',.048],[0,0.4,'b',0],[220,0.6,'b',.052],[0,0.4,'b',0],
  [233,0.6,'b',.05],[247,0.6,'b',.048],[261,1,'b',.055],[0,1,'b',0],
  // bars 7-8: turnaround A7→Dm
  [220,0.6,'b',.05],[0,0.4,'b',0],[233,0.5,'b',.048],[0,0.5,'b',0],
  [247,0.6,'b',.05],[0,0.4,'b',0],[220,0.5,'b',.052],[0,0.5,'b',0],
  [208,0.6,'b',.05],[0,0.4,'b',0],[196,0.6,'b',.048],[0,0.4,'b',0],
  [175,0.6,'b',.05],[0,0.4,'b',0],[147,2,'b',.058],[0,2,'b',0],
];

// Off-beat chord stabs (the "squiggle" sound from Seinfeld)
var JZ_STAB=[
  // hits on the "and" of beats — very short, higher register
  [0,2,'s',0],[587,0.2,'s',.025],[0,1.8,'s',0],
  [0,1.5,'s',0],[554,0.2,'s',.022],[0,2.3,'s',0],
  [0,1,'s',0],[523,0.2,'s',.024],[0,0.8,'s',0],[554,0.2,'s',.02],[0,1.8,'s',0],
  [0,2,'s',0],[587,0.2,'s',.025],[0,1.8,'s',0],
  [0,1.5,'s',0],[622,0.2,'s',.022],[0,2.3,'s',0],
  [0,0.8,'s',0],[587,0.2,'s',.02],[0,0.6,'s',0],[622,0.2,'s',.02],[0,1.2,'s',0],
  [0,3,'s',0],[659,0.3,'s',.028],[0,4.7,'s',0],
  [0,1.5,'s',0],[587,0.2,'s',.022],[0,0.5,'s',0],[622,0.2,'s',.02],[0,1.6,'s',0],
];

// BOSS battle theme — tense, chromatic, repetitive dread
var BS_MEL=[
  [110,.12],[110,.12],[0,.06],[165,.2],[0,.06],[110,.12],[0,.06],
  [147,.28],[110,.14],[0,.06],[130,.2],[0,.06],[110,.14],[0,.06],
  [98,.28],[0,.06],[98,.14],[98,.14],[0,.06],[147,.2],[0,.06],
  [131,.14],[0,.06],[123,.2],[0,.06],[110,.38],[0,.14],
];
var BS_BAS=[
  [55,.12],[55,.12],[0,.06],[82,.2],[0,.06],[55,.12],[0,.06],
  [73,.28],[55,.14],[0,.06],[65,.2],[0,.06],[55,.14],[0,.06],
  [49,.28],[0,.06],[49,.14],[49,.14],[0,.06],[73,.2],[0,.06],
  [65,.14],[0,.06],[61,.2],[0,.06],[55,.38],[0,.14],
];

// Jazz sequencer — plays melody, bass, stabs on separate independent pointers
var _bpM=0,_bpB=0,_bpS=0, _biM=0,_biB=0,_biS=0;
var _bpBoss=0,_biBoss=0;

function _sc(){
  var c=ac();
  var b=BEAT/_tempo; // beat duration scaled by tempo

  if(_bm==='boss'){
    // Boss: simple two-voice
    while(_bpBoss<c.currentTime+2){
      var m=BS_MEL[_biBoss%BS_MEL.length];
      var b2=BS_BAS[_biBoss%BS_BAS.length];
      var dt=_bpBoss-c.currentTime;
      if(m[0]>0)tn(m[0],m[1]*.8*_tempo,'square',.055,dt);
      if(b2[0]>0)tn(b2[0],b2[1]*.8*_tempo,'triangle',.032,dt);
      _bpBoss+=m[1]*BEAT;_biBoss++;
    }
  } else {
    // Jazz: three voices — melody, bass, stabs
    while(_bpM<c.currentTime+2){
      var en=JZ_MEL[_biM%JZ_MEL.length];
      var dt=_bpM-c.currentTime;
      if(en[0]>0){
        // Melody: square wave for 8-bit feel, shorter for staccato
        var dur=Math.max(0.02, en[1]*b*0.7);
        tn(en[0],dur,'square',en[3]*1.1,dt);
        // Add subtle harmony a minor third above occasionally for richness
        if(_biM%8===3&&en[0]>0)tn(en[0]*1.189,dur*.8,'square',en[3]*.35,dt);
      }
      _bpM+=en[1]*b; _biM++;
    }
    while(_bpB<c.currentTime+2){
      var en2=JZ_BAS[_biB%JZ_BAS.length];
      var dt2=_bpB-c.currentTime;
      if(en2[0]>0){
        // Bass: triangle for warmth, very staccato
        var dur2=Math.max(0.02, en2[1]*b*0.55);
        tn(en2[0],dur2,'triangle',en2[3]*1.2,dt2);
        // Occasional octave doubling for punch
        if(_biB%6===0)tn(en2[0]*2,dur2*.6,'square',en2[3]*.3,dt2);
      }
      _bpB+=en2[1]*b; _biB++;
    }
    while(_bpS<c.currentTime+2){
      var en3=JZ_STAB[_biS%JZ_STAB.length];
      var dt3=_bpS-c.currentTime;
      if(en3[0]>0){
        // Stabs: sine wave, very brief — the "squiggle" notes
        tn(en3[0],en3[1]*b*0.5,'sine',en3[3]*1.3,dt3);
        // add a higher partial for brightness
        tn(en3[0]*1.5,en3[1]*b*0.3,'sine',en3[3]*.4,dt3);
      }
      _bpS+=en3[1]*b; _biS++;
    }
  }
  _bt=setTimeout(_sc, 500);
}

function bgStart(m){
  bgStop();_bm=m;
  var t=ac().currentTime+.06;
  _bpM=t;_bpB=t;_bpS=t;_bpBoss=t;
  _biM=0;_biB=0;_biS=0;_biBoss=0;
  _sc();
}
function bgStop(){if(_bt){clearTimeout(_bt);_bt=null;}}
function bgSetTempo(t){_tempo=Math.max(0.6,Math.min(2.0,t));}


// ═══ RICH SFX ═══
var SFX={
  talk:function(){
    for(var i=0;i<14;i++)tn(160+Math.random()*270,.065,'square',.058,i*.08+Math.random()*.018);
  },

  // CLAPS — 3 varieties
  clap:function(){
    // Variant picked randomly for variety
    var v=Math.floor(Math.random()*3);
    if(v===0){
      // Polite scattered clap
      for(var i=0;i<6;i++){nz(.07,.18+Math.random()*.06,i*.16,'fade');nz(.04,.12,i*.16+.06,'fade');}
    }else if(v===1){
      // Enthusiastic clap burst
      for(var i=0;i<9;i++){nz(.08,.26,i*.11,'fade');if(i%2===0)nz(.04,.1,i*.11+.04,'fade');}
    }else{
      // Slow building clap
      for(var i=0;i<5;i++){var t=i*.22;nz(.09,.2,t,'fade');nz(.05,.14,t+.08,'fade');}
    }
  },
  bigClap:function(){
    // Stadium-level applause
    for(var i=0;i<16;i++){nz(.08,.22+Math.random()*.08,i*.06+Math.random()*.02,'fade');if(i%3===0)nz(.05,.12,i*.06+.03,'fade');}
    setTimeout(function(){for(var i=0;i<12;i++)nz(.07,.2,i*.07,'fade');},400);
  },

  // BOOS — 3 varieties
  boo:function(){
    var v=Math.floor(Math.random()*3);
    if(v===0){
      // Classic boo
      [280,255,225,205,185,175].forEach(function(f,i){tn(f,.22,'sawtooth',.065,i*.15);});
    }else if(v===1){
      // Rumbling groan
      [220,200,180,160,140].forEach(function(f,i){tn(f,.3,'sawtooth',.07,i*.12);});
      tn(110,.5,'sawtooth',.04,.3);
    }else{
      // Sharp hiss + boo combo
      nz(.15,.12,0,'fade');
      [260,230,200,170].forEach(function(f,i){tn(f,.28,'sawtooth',.06,i*.14+.1);});
    }
  },
  bigBoo:function(){
    // Crowd revolt
    [300,270,240,210,180,160,140].forEach(function(f,i){tn(f,.28,'sawtooth',.09,i*.1);});
    setTimeout(function(){nz(.4,.22,0,'fade');},200);
    setTimeout(function(){[220,190,160].forEach(function(f,i){tn(f,.3,'sawtooth',.07,i*.12);});},500);
  },

  // LAUGH — 3 varieties
  laugh:function(){
    var v=Math.floor(Math.random()*3);
    if(v===0){[330,400,480,550,480,400].forEach(function(f,i){tn(f,.14,'sine',.072,i*.14);});}
    else if(v===1){
      // Staggered chuckle wave
      [320,380,440,500,440].forEach(function(f,i){tn(f,.12,'sine',.06,i*.18);});
      setTimeout(function(){[340,400,460].forEach(function(f,i){tn(f,.14,'sine',.07,i*.16);});},400);
    }else{
      // Short sharp laughs
      for(var i=0;i<4;i++){[380,460,520].forEach(function(f,j){tn(f,.08,'sine',.08,i*.25+j*.04);});}
    }
  },
  biglaugh:function(){
    [310,390,470,550,630,550,470].forEach(function(f,i){tn(f,.16,'sine',.1,i*.1);});
    for(var i=0;i<3;i++)tn(190+i*70,.22,'triangle',.05,i*.16);
    setTimeout(function(){SFX.bigClap();},600);
  },

  // GROAN — crowd "ohhhh" for dud jokes
  groan:function(){
    [200,190,180,170,160].forEach(function(f,i){tn(f,.4,'sawtooth',.05,i*.08);});
    setTimeout(function(){nz(.3,.08,0,'fade');},300);
  },

  // CRICKETS (silence / dead) — chirp SFX
  crickets:function(){
    // High staccato chirps
    for(var i=0;i<6;i++){
      var t=i*.35+Math.random()*.1;

      tn(3600+Math.random()*400,.03,'square',.018,t+.04);

  // GESTURE SOUNDS
  gestureMic:function(){nz(.08,.15,0,'fade');tn(200,.1,'square',.04,.1);},  // mic tap
  gestureStep:function(){nz(.12,.2,0,'fade');nz(.08,.15,.14,'fade');},        // footstep

  gestureCard:function(){  // card flick

  gestureWhoosh:function(){  // something thrown / falling
    tn(440,.05,'sawtooth',.05,0);tn(300,.12,'sawtooth',.06,.05);nz(.08,.18,.1,'fade');
  },

  edgygood:function(){[440,523,659,784,1047].forEach(function(f,i){tn(f,.15,'square',.09,i*.09);});setTimeout(function(){SFX.biglaugh();},250);},
  edgybad:function(){[523,466,440,392,349,330].forEach(function(f,i){tn(f,.24,'sawtooth',.09,i*.12);});setTimeout(function(){SFX.bigBoo();},250);},
  win:function(){[220,330,440,550,660,880].forEach(function(f,i){tn(f,.13,'square',.09,i*.09);});setTimeout(function(){SFX.biglaugh();},550);},
  gameover:function(){[290,245,195,145,95].forEach(function(f,i){tn(f,.32,'sawtooth',.11,i*.28);});},
  tick:function(t){if(t<=3)tn(t===1?1047:880,.055,'square',.045);},
  penalty:function(){tn(200,.15,'sawtooth',.1);tn(150,.15,'sawtooth',.08,.18);},
  alarm:function(){for(var i=0;i<8;i++){tn(880,.1,'square',.08,i*.22);tn(660,.1,'square',.06,i*.22+.11);}},
  ringtone:function(){[523,523,0,523,523,0,523,659].forEach(function(f,i){if(f)tn(f,.12,'square',.07,i*.14);});},
  cough:function(){nz(.12,.3,0,'fade');nz(.14,.3,.18,'fade');nz(.1,.25,.36,'fade');},
  choke:function(){nz(.08,.2,0,'fade');nz(.18,.3,.12,'fade');tn(200,.2,'sawtooth',.04,.5);},
  fight:function(){nz(.06,.35,0,'fade');nz(.06,.35,.12,'fade');SFX.bigBoo();},
  fart:function(){try{var c=ac(),now=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(120,now);o.frequency.exponentialRampToValueAtTime(40,now+.6);g.gain.setValueAtTime(.18,now);g.gain.exponentialRampToValueAtTime(.0001,now+.65);o.connect(g);g.connect(c.destination);o.start(now);o.stop(now+.7);nz(.6,.15,.1,'fade');}catch(e){}},
  magic:function(){[523,659,784,1047,784,659,523].forEach(function(f,i){tn(f,.12,'sine',.09,i*.09);});SFX.gestureCard();},
  dance:function(){[262,330,392,523,392,330,262].forEach(function(f,i){tn(f,.1,'square',.07,i*.1);});SFX.gestureStep();},
  trip:function(){SFX.gestureWhoosh();setTimeout(function(){nz(.2,.25,0,'fade');},400);setTimeout(function(){SFX.bigBoo();},600);},
  propose:function(){[523,659,784,1047].forEach(function(f,i){tn(f,.2,'sine',.1,i*.15);});setTimeout(function(){SFX.biglaugh();},700);}
};

function engMult(){return 0.25+(S.engage/100)*1.5;}

// Called after each action resolves. ld = actual laugh delta applied.
function updateStreak(ld){
  if(ld>0){
    S.goodStreak++;S.goodConsec++;S.badStreak=0;
    if(S.goodStreak>=3&&!S.streakActive){
      S.streakActive=true;
      bgSetTempo(1.55);
      S.penaltyMsg='🔥 HOT STREAK! KEEP IT GOING!';
      clearTimeout(S.penaltyT);
      S.penaltyT=setTimeout(function(){S.penaltyMsg='';render();},2800);
    } else if(S.goodStreak>=3){
      bgSetTempo(1.55);
    }
    // 4 good in a row — 12.5% TV deal
    if(S.goodConsec>=4&&Math.random()<0.125){
      S.acting=false;
      setTimeout(function(){triggerSpecial('tvdeal');},600);
      return;
    }
  } else {
    S.goodStreak=0;S.goodConsec=0;
    S.badStreak++;
    if(S.streakActive){S.streakActive=false;bgSetTempo(1.0);}
    // 3 bad in a row — 12.5% pulled off stage
    if(S.badStreak>=3&&Math.random()<0.125){
      S.acting=false;
      setTimeout(function(){triggerSpecial('pulledoffstage');},600);
      return;
    }
  }
}

// 100% bar check — called after applyDeltas
function check100Trigger(){
  if(S.laugh>=100||S.engage>=100){
    var r=Math.random();
    if(r<0.125){setTimeout(function(){triggerSpecial('legend');},800);}
    else if(r<0.25){setTimeout(function(){triggerSpecial('paparazzi');},800);}
  }
}

function triggerSpecial(type){
  stopTmr();bgStop();
  S.specialScreen=type;
  if(type==='legend'||type==='paparazzi'||type==='tvdeal'){SFX.biglaugh();SFX.bigClap();}
  else{SFX.gameover();}
  render();
}

// Speed modifier based on how fast player acted during hot streak
// Returns a multiplier for ld/ed deltas
function streakSpeedMod(){
  if(!S.streakActive)return 1.0;
  var elapsed=(Date.now()-S.lastActTime)/1000; // seconds since timer started
  // < 4s = fast = BONUS (1.5x)
  // 4-6s = normal (1.0x)
  // > 6s = slow = MELLOW (0.45x)
  if(elapsed<4)return 1.5;
  if(elapsed<=6)return 1.0;
  return 0.45;
}

function applyDeltas(ld,ed){
  var actualLaugh=Math.round(ld*engMult());
  S.laugh=Math.min(100,Math.max(0,S.laugh+actualLaugh));
  S.engage=Math.min(100,Math.max(0,S.engage+ed));
  if(S.laugh>=100){
    S.stars++;
    S.score+=30+~~(S.engage/5);
    S.laugh=65;
    setTimeout(function(){SFX.biglaugh();SFX.bigClap();},200);
  }
  return{laugh:S.laugh,engage:S.engage};
}

function stopTmr(){if(_ti){clearInterval(_ti);_ti=null;}}
function startTmr(){
  stopTmr();S.timer=10;render();
  _ti=setInterval(function(){
    if(S.acting||S.heck)return;
    SFX.tick(S.timer);
    if(S.timer<=1){
      applyDeltas(-8,-20);
      S.react='booing';S.msg='"..."\n*crickets*';render();
      if(S.engage<=0){stopTmr();setTimeout(endGame,1300);return;}
      clearTimeout(S.mT);S.mT=setTimeout(function(){S.react='neutral';S.msg='';S.timer=10;render();},1600);
    }else{S.timer--;render();}
  },1000);
}

// PEE MECHANIC — roll after every 4th turn
function rollPee(){
  if(S.needsPee)return; // already active
  if(S.turnCount>0&&S.turnCount%4===0&&Math.random()<(1/32)){
    S.needsPee=true;
    S.peeCountdown=2+~~(Math.random()*2); // 2 or 3 moves

// Early round modifier: rounds 1-2 jokes get a penalty
function earlyPenalty(delta){
  if(S.round<=2&&delta>0){
    // good jokes in early rounds are less effective
    delta=Math.max(1,Math.floor(delta*0.45));
  }
  return delta;
}

// ═══ WIDER JOKE DELTA RANGES ═══
// Returns {laughDelta, engageDelta, react, dud}
function jd(joke,isCustom){
  if(!joke&&!isCustom)return{ld:0,ed:0,react:'neutral'};
  if(isCustom){
    if(Math.random()>.5)return{ld:35+~~(Math.random()*35),ed:10+~~(Math.random()*15),react:'laughing'};
    return{ld:-30-~~(Math.random()*30),ed:-15-~~(Math.random()*15),react:'booing'};
  }
  if(joke.type==='dud'){return{ld:-(1+~~(Math.random()*4)),ed:-8,react:'neutral',dud:true};}
  var r=Math.random();
  if(joke.type==='flat'){return{ld:~~(Math.random()*8)-4,ed:~~(Math.random()*6)-3,react:r>.5?'clapping':'neutral'};}
  if(joke.type==='political'){
    if(r>.6)return{ld:12+~~(Math.random()*20),ed:5+~~(Math.random()*10),react:'laughing'};
    if(r>.3)return{ld:2+~~(Math.random()*10),ed:2+~~(Math.random()*6),react:'clapping'};
    return{ld:-10-~~(Math.random()*20),ed:-8-~~(Math.random()*12),react:'booing'};
  }
  // good — much wider range
  if(r>.7)return{ld:18+~~(Math.random()*32),ed:8+~~(Math.random()*18),react:'laughing'};   // banger
  if(r>.5)return{ld:8+~~(Math.random()*16),ed:4+~~(Math.random()*10),react:'laughing'};    // good
  if(r>.35)return{ld:3+~~(Math.random()*10),ed:2+~~(Math.random()*6),react:'clapping'};   // decent
  if(r>.2)return{ld:-4-~~(Math.random()*8),ed:-4-~~(Math.random()*6),react:'booing'};     // misfire
  return{ld:-12-~~(Math.random()*24),ed:-10-~~(Math.random()*16),react:'booing'};          // bomb
}

function earlyDamp(ld){
  if(S.round<2&&ld>0)return Math.max(1,Math.floor(ld*0.45));

}

    SFX.talk();
    var cw=CROWD[~~(Math.random()*CROWD.length)];
    ld=earlyDamp(8+~~(Math.random()*16));ed=4+~~(Math.random()*10);
    react='clapping';msg='"'+cw+'"';
    setTimeout(function(){SFX.clap();},880);
    S.jokes++;S.round++;
    var sp2=chkStreak('crowd');if(sp2<0){ld+=sp2;ed+=Math.round(sp2*0.5);pm='STREAK PENALTY -10';}
    lab='CROWD WORK';
  }
  else if(action==='oneliner'){
    SFX.talk();
    var ol=OL[~~(Math.random()*OL.length)],r2=Math.random();
    if(r2>.55){ld=10+~~(Math.random()*22);ed=5+~~(Math.random()*12);react='laughing';setTimeout(function(){SFX.laugh();},880);}
    else if(r2>.3){ld=3+~~(Math.random()*12);ed=2+~~(Math.random()*8);react='clapping';setTimeout(function(){SFX.clap();},880);}
    else{ld=-8-~~(Math.random()*18);ed=-6-~~(Math.random()*12);react='booing';setTimeout(function(){SFX.boo();},880);}
    ld=earlyDamp(ld);
    msg='"'+ol+'"';S.jokes++;S.round++;
    var sp3=chkStreak('oneliner');if(sp3<0){ld+=sp3;ed+=Math.round(sp3*0.5);pm='STREAK PENALTY -10';}
    lab='ONE-LINER';
  }
  else if(action==='callback'){
    SFX.talk();
    var cb=CALLBACKS[~~(Math.random()*CALLBACKS.length)];
    var pg=S.jokeLog.filter(function(j){return j.ld>0;}).length;
    ld=pg>0?12+~~(Math.random()*18):2+~~(Math.random()*8);
    ed=pg>0?6+~~(Math.random()*10):1+~~(Math.random()*5);
    react=ld>10?'laughing':'clapping';msg=cb;
    setTimeout(function(){if(ld>10)SFX.laugh();else SFX.clap();},900);
    lab='CALLBACK';chkStreak('callback');
  }
  else if(action==='stall'){
    SFX.talk();
    var st=STALLS[~~(Math.random()*STALLS.length)];
    // Stall: small laugh loss, bigger engage loss
    ld=-4;ed=-14;
    msg=st;react='neutral';
    SFX.gestureMic();
    lab='STALL';chkStreak('stall');
  }
  else if(action==='improv'){
    SFX.talk();
    var good=Math.random()>.5;
    if(good){
      ld=30+~~(Math.random()*50);ed=15+~~(Math.random()*25);react='laughing';
      setTimeout(function(){SFX.biglaugh();},800);
      msg='*launches into improvised bit*\n...somehow it lands perfectly.';
    }else{
      ld=-28-~~(Math.random()*42);ed=-20-~~(Math.random()*25);react='booing';
      setTimeout(function(){SFX.bigBoo();},800);
      msg='*launches into improvised bit*\n...it goes spectacularly wrong.';
    }
    clearTimeout(S.fT);S.flash=good?'good':'bad';
    S.fT=setTimeout(function(){S.flash=null;render();},2600);
    lab='IMPROV';chkStreak('improv');
  }
  else if(action==='pee_leave'){
    // Comedian dashes off stage
    S.needsPee=false;S.acting=false;
    // Leaving the stage drops engagement but saves from accident
    applyDeltas(-10,-25);
    S.log.push({action:'LEFT STAGE (🚽)',ld:-10,ed:-25,laugh:S.laugh,engage:S.engage});
    if(S.engage<=0){endGame();return;}
    render();startTmr();return;
  }
  else if(action==='end'){S.acting=false;endGame();return;}

  // Apply hint bonus — small positive boost added to deltas
  if(_hintBonus&&action!=='stall'&&action!=='pee_leave'){
    ld=ld+~~(4+Math.random()*8);
    ed=ed+~~(2+Math.random()*5);
    pm=(pm?pm+' ':'')+'💡 HINT FOLLOWED!';
  }
  if(pm){S.penaltyMsg=pm;clearTimeout(S.penaltyT);S.penaltyT=setTimeout(function(){S.penaltyMsg='';render();},2400);}
  S.msg=msg;S.react=react;render();

  S.lastActTime=_actNow; // store for speed calc
  S.mT=setTimeout(function(){
    // Apply streak speed multiplier to deltas
    var spd=streakSpeedMod();
    var finalLd=Math.round(ld*spd);
    var finalEd=Math.round(ed*spd);
    applyDeltas(finalLd,finalEd);
    updateStreak(finalLd);
    var speedTag=spd>1.2?' ⚡FAST':spd<0.5?' 💤SLOW':'';
    S.log.push({action:lab+speedTag,ld:finalLd,ed:finalEd,laugh:S.laugh,engage:S.engage});
    // Reset lastActTime for next action
    S.lastActTime=Date.now();
    S.msg='';S.react='neutral';S.acting=false;S.sa=null;
    // Pee countdown
    if(S.needsPee&&action!=='pee_leave'){
      S.peeCountdown--;
      if(S.peeCountdown<=0){
        S.needsPee=false;
        if(S.peeResult==='accident_win'){
          // Somehow the crowd loves it
          S.laugh=Math.min(100,S.laugh+40);S.engage=Math.min(100,S.engage+30);
          triggerSpecial('pee_win');return;
        }else{
          S.engage=0;triggerSpecial('pee_boo');return;
        }
      }
    }
    S.turnCount++;
    render();
    if(S.engage<=0){endGame();return;}
    if(S.heckPending&&!S.heck){S.heckPending=false;S.heck=true;bgStart('boss');render();return;}
    // Check wild events
    if(checkWildEvents())return;
    // Pee roll
    rollPee();
    S.pendingEvent=rollEvent();
    S.hint=rollHint();
    startTmr();
  },2700);
}

function endGame(){
  stopTmr();bgStop();
  // Final score = accumulated score + current laugh level
  var total=S.score+S.laugh;
  var g=total>=200?'S':total>=140?'A':total>=90?'B':total>=55?'C':total>=30?'D':'F';
  S.grade=g;S.review=REVIEWS[g][0];S.screen='review';SFX.gameover();render();
}

function startGame(){
  stopTmr();bgStop();clearTimeout(S.mT);clearTimeout(S.fT);
  var heck=Math.random()<(1/64);
  Object.assign(S,{screen:'game',laugh:40,engage:60,score:0,stars:0,jokes:0,eu:false,timer:10,acting:false,msg:'',react:'neutral',heck:heck,log:[],grade:'',flash:null,pressed:null,sa:null,usedJokes:{},actionStreak:[],penaltyMsg:'',jokeLog:[],pendingEvent:null,heckPending:false,showCustomInput:false,round:0,goodStreak:0,streakActive:false,lastActTime:Date.now(),badStreak:0,goodConsec:0,specialScreen:null,hint:null,turnCount:0,needsPee:false,peeCountdown:0,peeResult:null});
  bgSetTempo(1.0);
  render();
  setTimeout(function(){bgStart(heck?'boss':'jazz');if(!heck)startTmr();},200);
}

  var html;
  if(S.screen==='start')html=sStart();
  else if(S.screen==='game'){

}

  +'<div id="btnEdgy" style="width:96px;flex:1;background:'+(eu?'#080808':'#3a1000')+';border:4px solid '+(eu?'#181818':'#ff6200')+';border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:'+(acting||eu?'default':'pointer')+(eu?'':';animation:edgyGlow 1.4s infinite')+';">'
  +'<div style="font-size:24px;">🔥</div>'
  +'<div style="font-family:\'Press Start 2P\',monospace;font-size:8.5px;color:'+(eu?'#222':'#ff8833')+';text-align:center;line-height:1.6;">'+(eu?'EDGY<br>USED':'EDGY<br>JOKE')+'</div>'
  +'<div style="font-family:\'Press Start 2P\',monospace;font-size:4.5px;color:'+(eu?'#151515':'#ff5500')+';text-align:center;line-height:1.5;">'+(eu?'spent':'1× use<br>[E]')+'</div>'
  +'</div>'
  // YOUR JOKE BUTTON
  +(hasCustom?'<div id="btnCustomJoke" style="width:96px;flex:1;background:#0a1a2a;border:4px solid #44aaff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:'+(acting?'default':'pointer')+';animation:jGlow 1.6s infinite;">'
  +'<div style="font-size:24px;">✍️</div>'
  +'<div style="font-family:\'Press Start 2P\',monospace;font-size:8.5px;color:#88ccff;text-align:center;line-height:1.6;">YOUR<br>JOKE</div>'
  +'<div style="font-family:\'Press Start 2P\',monospace;font-size:4.5px;color:#4488aa;text-align:center;line-height:1.5;">BIG SWING<br>[J]</div>'
  +'</div>'
  :'<div style="width:96px;flex:1;background:#0d0d0d;border:4px solid #1a1a1a;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;opacity:.2;">'
  +'<div style="font-size:24px;">✍️</div>'
  +'<div style="font-family:\'Press Start 2P\',monospace;font-size:7px;color:#222;text-align:center;line-height:1.6;">NO JOKE<br>LOADED</div>'
  +'<div style="font-family:\'Press Start 2P\',monospace;font-size:4px;color:#111;text-align:center;">write one<br>on start screen</div>'
  +'</div>')
  +'</div>'
  +'</div>'
  )
  // IMPROV BUTTON — only when laugh is low (<30)
  +(laugh<30&&!heck?'<div style="width:100%;padding:0 5px;flex-shrink:0;margin-top:4px;"><div id="btnImprov" style="width:100%;background:#220022;border:3px solid #cc44cc;border-radius:8px;padding:7px 10px;cursor:'+(acting?'default':'pointer')+';display:flex;align-items:center;gap:10px;box-shadow:0 0 12px rgba(180,50,180,.4);animation:pop .8s infinite;"><div style="font-size:22px;">🎲</div><div style="flex:1;"><div style="font-family:\'Press Start 2P\',monospace;color:#dd88ff;font-size:9px;line-height:1.5;">IMPROV</div><div style="font-family:\'Press Start 2P\',monospace;color:#996699;font-size:5.5px;margin-top:2px;">BIG SWING · BOOM OR BUST [I]</div></div></div></div>':'')
  // STATS FOOTER
  +'<div style="flex-shrink:0;width:100%;display:flex;gap:10px;align-items:center;padding:0 4px;">'
  +'<div style="font-family:\'Press Start 2P\',monospace;color:#2a2a44;font-size:5.5px;">JOKES: <span style="color:#6666aa;">'+jk+'</span>/5</div>'
  +'<div style="font-family:\'Press Start 2P\',monospace;color:#3a2800;font-size:5px;">SCR: <span style="color:#aaaa22;">'+sc+'</span></div>'
  +(hasCb?'<div style="font-family:\'Press Start 2P\',monospace;color:#2a3a6a;font-size:5px;">↩ CALLBACK</div>':'')
  +(hasCustom?'<div style="font-family:\'Press Start 2P\',monospace;color:#1a3a4a;font-size:5px;">✍ [J]=YOUR JOKE</div>':'')
  +(streakActive?'<div style="font-family:\'Press Start 2P\',monospace;color:#ff8800;font-size:6px;animation:pop .5s infinite;">🔥 STREAK x'+streak+'!</div>':'')
  +(canEnd&&!heck?'<div style="font-family:\'Press Start 2P\',monospace;color:#44ff88;font-size:5.5px;animation:pop 1.2s infinite;margin-left:auto;">★ ▼ END</div>':'')
  +'</div>'
  +'</div>'
  +'</div>';
}

function sReview(){
  var total=S.score+S.laugh,g=S.grade,rv=S.review,log=S.log;
  var gc={S:'#ffff44',A:'#44ff88',B:'#44aaff',C:'#ffaa00',D:'#ff6600',F:'#ff2222'}[g];
  return '<div style="width:100%;height:100vh;background:#000;display:flex;align-items:center;justify-content:center;padding:12px;overflow-y:auto;">'
  +'<div style="max-width:348px;width:100%;background:#06000b;border:4px solid #ffcc00;padding:18px;text-align:center;box-shadow:0 0 50px #aa5500;">'
  +'<div style="font-family:\'Press Start 2P\',monospace;color:#ffcc00;font-size:9px;margin-bottom:12px;">★  SHOW REVIEW  ★</div>'
  +'<div style="font-family:\'Press Start 2P\',monospace;font-size:64px;color:'+gc+';text-shadow:0 0 30px '+gc+',0 0 60px '+gc+'55;margin-bottom:5px;">'+g+'</div>'
  +'<div style="font-family:\'Press Start 2P\',monospace;color:#555;font-size:6px;margin-bottom:5px;">SCORE: '+(total)+' pts · ★'+S.stars+' STARS</div>'
  +'<div style="font-family:\'Press Start 2P\',monospace;color:#3a3a3a;font-size:5.5px;margin-bottom:12px;">LAUGH: '+S.laugh+' · ENGAGE: '+S.engage+'</div>'
  +'<div style="display:flex;gap:12px;align-items:flex-start;background:#0e0e0e;border:2px solid #1a1a1a;padding:12px;margin-bottom:14px;text-align:left;">'
  +'<div style="position:relative;width:38px;height:62px;flex-shrink:0;">'
  +'<div style="position:absolute;top:0;left:10px;width:18px;height:5px;background:#1a1a1a;"></div>'
  +'<div style="position:absolute;top:4px;left:9px;width:20px;height:18px;background:#c68642;border:2px solid #8a5a2a;"></div>'
  +'<div style="position:absolute;top:7px;left:9px;width:20px;height:6px;background:#444;"></div>'
  +'<div style="position:absolute;top:21px;left:5px;width:28px;height:26px;background:#1a1a1a;border:2px solid #2a2a2a;"></div>'
  +'<div style="position:absolute;top:25px;left:15px;width:8px;height:18px;background:#aa0000;border:1px solid #880000;"></div>'
  +'<div style="position:absolute;top:47px;left:6px;width:11px;height:15px;background:#111;border:1px solid #222;"></div>'
  +'<div style="position:absolute;top:47px;left:21px;width:11px;height:15px;background:#111;border:1px solid #222;"></div>'
  +'</div>'
  +'<div style="flex:1;">'
  +'<div style="font-family:\'Press Start 2P\',monospace;color:#ffcc00;font-size:6px;margin-bottom:6px;">CLUB MANAGER:</div>'
  +'<div style="font-family:\'Press Start 2P\',monospace;color:#ddd;font-size:6.5px;line-height:2.1;white-space:pre-line;">'+rv+'</div>'
  +'</div></div>'
  +'<div style="border:2px solid #131313;padding:8px;margin-bottom:14px;text-align:left;max-height:100px;overflow-y:auto;">'
  +'<div style="font-family:\'Press Start 2P\',monospace;color:#ffcc00;font-size:5.5px;margin-bottom:5px;">PERFORMANCE LOG:</div>'
  +(log.length===0?'<div style="font-family:\'Press Start 2P\',monospace;color:#222;font-size:5.5px;">No actions taken.</div>':
    log.map(function(e,i){var eff=e.ld||e.delta||0;return '<div style="font-family:\'Press Start 2P\',monospace;color:'+(eff>=0?'#44ff88':'#ff4444')+';font-size:5px;margin-bottom:3px;">#'+(i+1)+' '+String(e.action).toUpperCase()+' L:'+(eff>=0?'+':'')+eff+(e.ed!==undefined?' E:'+(e.ed>=0?'+':'')+e.ed:'')+' →😄'+e.laugh+'</div>';}).join('')
  )+'</div>'
  +'<button id="btnAgain" style="width:100%;background:#cc0000;color:#fff;font-family:\'Press Start 2P\',monospace;border:3px solid #ffcc00;padding:13px;font-size:10px;cursor:pointer;box-shadow:4px 4px 0 #880000;">↩  PLAY AGAIN</button>'
  +'</div></div>';
}

// ════════════ EVENTS ════════════
function handleDir(dir){
  if(S.screen!=='game'||S.acting)return;
  if(S.heck){doAct('heckler');return;}
  S.pressed=dir;render();setTimeout(function(){S.pressed=null;},160);
  if(dir==='up')doAct('joke');
  else if(dir==='left')doAct('crowd');
  else if(dir==='right')doAct('oneliner');
  else if(dir==='down'){
    if(S.jokes>=5)doAct('end');
    else if(S.jokeLog.length>0)doAct('callback');
    else doAct('stall');
  }
}
function saveJoke(){
  var ji=document.getElementById('jokeInput');
  if(ji&&ji.value.trim().length>0)S.customJoke=ji.value.trim().substring(0,40);
  S.showCustomInput=false;render();
}
function bind(){
  var s=document.getElementById('btnStart');if(s)s.onclick=startGame;
  var a=document.getElementById('btnAgain');if(a)a.onclick=function(){S.screen='start';render();};
  var c=document.getElementById('btnCustom');if(c)c.onclick=function(){S.showCustomInput=true;render();};
  ['up','down','left','right'].forEach(function(dir){var el=document.getElementById('dp_'+dir);if(el)el.onclick=function(){handleDir(dir);};});
  var be=document.getElementById('btnEdgy');if(be)be.onclick=function(){if(!S.acting&&!S.eu&&!S.heck)doAct('edgy');};
  var bj=document.getElementById('btnCustomJoke');if(bj)bj.onclick=function(){if(!S.acting&&!S.heck&&S.customJoke)doAct('custom_joke');};
  var ev=document.getElementById('btnEvent');if(ev)ev.onclick=function(){if(!S.acting&&S.pendingEvent&&!S.heck)doAct('event');};
  var ji=document.getElementById('jokeInput');
  if(ji){
    ji.focus();
    var jcc=document.getElementById('jcc');
    ji.addEventListener('input',function(){if(jcc)jcc.textContent=ji.value.length+' / 40';});
    ji.addEventListener('keydown',function(e){if(e.key==='Enter')saveJoke();if(e.key==='Escape'){S.showCustomInput=false;render();}});
  }
  // Special screen button
  var bsp=document.getElementById('btnSpecial');
  if(bsp)bsp.onclick=function(){
    var action=bsp.getAttribute('data-action');
    if(action==='win'){S.specialScreen=null;S.laugh=100;S.score+=200;S.stars+=5;endGame();}
    else if(action==='lose'){S.specialScreen=null;S.engage=0;endGame();}
    else{S.specialScreen=null;render();if(!S.acting)startTmr();}
  };
  // PEE LEAVE button
  var bpee=document.getElementById('btnPeeLeave');
  if(bpee)bpee.onclick=function(){if(!S.acting)doAct('pee_leave');};
  var bsp2=document.getElementById('btnImprov');
  if(bsp2)bsp2.onclick=function(){if(!S.acting&&!S.heck)doAct('improv');};
  var bs=document.getElementById('btnSave');if(bs)bs.onclick=saveJoke;
  var bc=document.getElementById('btnCancel');if(bc)bc.onclick=function(){S.showCustomInput=false;render();};
}

document.addEventListener('keydown',function(e){
  if(S.screen!=='game')return;
  var m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
  var w={w:'up',s:'down',a:'left',d:'right'};
  var dir=m[e.key]||w[e.key.toLowerCase()];
  if(dir){e.preventDefault();handleDir(dir);return;}
  var k=e.key.toLowerCase();
  if(k==='e'&&!S.acting&&!S.eu&&!S.heck){e.preventDefault();doAct('edgy');}
  else if(k==='j'&&!S.acting&&!S.heck&&S.customJoke){e.preventDefault();doAct('custom_joke');}
  else if(k==='r'&&S.pendingEvent&&!S.acting&&!S.heck){e.preventDefault();doAct('event');}
  else if(k==='i'&&!S.acting&&!S.heck&&S.laugh<30){e.preventDefault();doAct('improv');}
  else if(k==='p'&&S.needsPee&&!S.acting){e.preventDefault();doAct('pee_leave');}
  else if(k==='h'&&!S.heck&&!S.heckPending){
    e.preventDefault();
    S.heckPending=true;
    S.penaltyMsg='HECKLER INCOMING...';
    clearTimeout(S.penaltyT);
    S.penaltyT=setTimeout(function(){S.penaltyMsg='';render();},2000);
    render();
  }
});

render();
</script>
